<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código Barber | Acceso Panel</title>
  <link rel="stylesheet" href="/src/css/global.css">
</head>

<body class="login-page">
  <div class="login-container">
    <div class="login-banner">
      <img src="/images/Logo/logo.png" alt="Logo" class="login-logo">
      <h2 class="login-brand-title">CÓDIGO BARBER</h2>
      <p class="login-subtitle">Acceso al <span>Panel</span></p>
      <small>Ingresa tus credenciales para continuar</small>
    </div>

    <div class="login-form-box">
      <h3>Iniciar sesión</h3>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="ejemplo@correo.com" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password" required>
        </div>

        <div class="form-options">
          <label class="remember-me"><input type="checkbox" id="rememberMe"> Recordarme</label>
          <a class="forgot-password" href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
        </div>

        <p id="loginMessage" class="auth-message" role="status" aria-live="polite"></p>
        <button type="submit" class="btn-submit-yellow">
          <span>INGRESAR AL PANEL</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
        <p class="login-footer-text">Solo personal autorizado</p>
      </form>
    </div>
  </div>

  <script type="module" src="/src/js/login.js"></script>
</body>
</html>
