<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código Barber | Restablecer contraseña</title>
  <link rel="stylesheet" href="/src/css/global.css">
</head>

<body class="login-page">
  <main class="login-container reset-password-container">
    <section class="login-form-box">
      <h3>Restablecer contraseña</h3>
      <p id="resetMessage" class="auth-message" role="status" aria-live="polite">
        Verificando el enlace de recuperación...
      </p>
      <form id="resetPasswordForm" hidden>
        <div class="form-group">
          <label for="newPassword">Nueva contraseña</label>
          <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="btn-submit-yellow">
          <span>GUARDAR CONTRASEÑA</span>
        </button>
      </form>
      <a class="forgot-password reset-login-link" href="/login.html">Volver al inicio de sesión</a>
    </section>
  </main>

  <script type="module" src="/src/js/reset-password.js"></script>
</body>
</html>
