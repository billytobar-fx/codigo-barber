<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código Barber | Reservas</title>


  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/variables.css">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body class="dashboard-body">

  <div class="dashboard-layout">

    <aside class="sidebar-panel">
      <div class="sidebar-panel__header">
        <a href="/dashboard.html" class="logo-box">
          <img src="/images/Logo/logo.png" alt="Código Barber Logo" class="logo-box__img" />
          <div class="logo-box__text">
            <span class="brand-title">CÓDIGO BARBER</span>
            <span class="brand-subtitle">HOUSE</span>
          </div>
        </a>
      </div>

      <nav class="sidebar-panel__menu">
        <a href="/dashboard.html" class="menu-item">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
          Inicio
        </a>
        <a href="/reservas.html" class="menu-item active">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Reservas
        </a>
        <a href="/perfil.html" class="menu-item">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Mi perfil
        </a>
      </nav>

      <div class="sidebar-panel__footer">
        <button id="btnLogout" class="btn-logout-panel">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Cerrar sesión
        </button>
      </div>
    </aside>

  
    <main class="dashboard-main-area">

      <header class="page-top-bar header-reservas">
        <div>
          <h1 class="page-title">Reservas</h1>
          <p class="page-subtitle">Consulta y gestiona todas las citas.</p>
        </div>
        <button type="button" id="btnLimpiarFiltros" class="btn-yellow-outline">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          <span>Limpiar filtros</span>
        </button>
      </header>

    
      <section class="panel-card" style="margin-bottom: 1.5rem;">
        <div class="filters-bar">
          <div class="filter-item">
            <label for="filterDate">Fecha</label>
            <input type="date" id="filterDate" class="filter-input">
          </div>

          <div class="filter-item">
            <label for="filterBarber">Barbero</label>
            <select id="filterBarber" class="filter-select">
              <option value="todos">Todos</option>
              <option value="Camilo Vargas">Camilo Vargas</option>
              <option value="Andres Rojas">Andres Rojas</option>
              <option value="Carlos Medina">Carlos Medina</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="searchClient">Buscar cliente</label>
            <input type="text" id="searchClient" class="filter-input" placeholder="Buscar por nombre o teléfono...">
          </div>
        </div>
      </section>

      <!-- TABLA DE RESERVAS -->
      <section class="panel-card">
        <div class="table-container">
          <table class="dark-table">
            <thead>
              <tr>
                <th>HORA</th>
                <th>FECHA</th>
                <th>CLIENTE</th>
                <th>NÚMERO</th>
                <th>SERVICIO</th>
                <th>BARBERO</th>
                <th>ESTADO</th>
                <th style="text-align: right;">ACCIONES</th>
              </tr>
            </thead>
            <tbody id="reservasTableBody">
              <tr>
                <td colspan="8" class="table-empty">Cargando reservas desde Supabase...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <div class="mobile-logout-footer">
        <button type="button" class="mobile-logout-button">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Cerrar sesión</span>
        </button>
      </div>

    </main>

  </div>

  <!-- SCRIPT -->
  <script type="module" src="./src/js/reservas.js"></script>
</body>

</html>
